name: Conversor

on:
  push:
    branches: [main]
    paths: ["conversor/**", ".github/workflows/conversor.yml"]
  pull_request:
    paths: ["conversor/**", ".github/workflows/conversor.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: conversor
          load: true
          tags: ia-local-conversor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pruebas dentro de la imagen
        run: |
          docker run --rm --user root -v "$PWD/conversor/tests:/app/tests:ro" ia-local-conversor:ci \
            sh -c "pip install --quiet pytest httpx && python -m pytest -q -p no:cacheprovider /app/tests"

      - name: Nombre de la imagen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ia-local-conversor" >> "$GITHUB_ENV"

      - name: Login en GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: conversor
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
